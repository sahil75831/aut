<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Horizontal Tilt Stream</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: linear-gradient(145deg, #0b1120 0%, #1a2332 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 32px;
      padding: 30px 28px;
      width: 100%;
      max-width: 720px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
    }

    h1 {
      color: #fff;
      font-weight: 300;
      font-size: 1.6rem;
      margin: 0 0 6px 0;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    h1 small {
      font-size: 0.9rem;
      font-weight: 400;
      color: #8899bb;
      margin-left: auto;
    }

    .sub {
      color: #7a8aaa;
      font-size: 0.9rem;
      margin-bottom: 28px;
      border-left: 3px solid #3b5b9b;
      padding-left: 14px;
    }

    .tracker-row {
      display: flex;
      gap: 32px;
      align-items: stretch;
      flex-wrap: wrap;
    }

    /* -------- HORIZONTAL THUMB TRACK (left) -------- */
    .track-wrapper {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 0;
      width: 100%;
      max-width: 280px;
    }

    .track-container {
      position: relative;
      width: 100%;
      height: 48px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 40px;
      box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.06);
      touch-action: none;
      cursor: pointer;
    }

    .track-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 50%;
      background: linear-gradient(90deg, #3b7bdd, #7a5cdb);
      border-radius: 40px;
      transition: width 0.08s ease;
      pointer-events: none;
      box-shadow: 0 0 20px rgba(59, 123, 221, 0.25);
    }

    .thumb {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 56px;
      height: 56px;
      background: radial-gradient(circle at 30% 30%, #eef3ff, #b0c8f0);
      border-radius: 50%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 0 2px rgba(255, 255, 255, 0.1);
      cursor: grab;
      touch-action: none;
      transition: box-shadow 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #1a2332;
      font-weight: 600;
      will-change: transform;
      user-select: none;
      left: 50%;
    }

    .thumb:active {
      cursor: grabbing;
      box-shadow: 0 8px 32px rgba(59, 123, 221, 0.5), 0 0 0 3px rgba(255, 255, 255, 0.2);
    }

    .thumb-label {
      color: #99aacd;
      font-size: 0.8rem;
      margin-top: 12px;
      text-align: center;
      letter-spacing: 0.5px;
      font-weight: 500;
    }

    /* -------- ARRAY DISPLAY (right) -------- */
    .stream-panel {
      flex: 1;
      min-width: 200px;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 20px;
      padding: 18px 20px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      display: flex;
      flex-direction: column;
    }

    .stream-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .stream-header span {
      color: #7a8aaa;
      font-size: 0.8rem;
      letter-spacing: 0.3px;
    }

    .badge {
      background: rgba(59, 123, 221, 0.2);
      color: #7aadff;
      padding: 2px 14px;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 500;
    }

    .array-container {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 14px;
      padding: 14px 16px;
      min-height: 140px;
      max-height: 200px;
      overflow-y: auto;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 0.85rem;
      line-height: 1.7;
      color: #c8d8f0;
      border: 1px solid rgba(255, 255, 255, 0.03);
      transition: border-color 0.2s;
      word-break: break-all;
    }

    .array-container:focus-within {
      border-color: rgba(59, 123, 221, 0.3);
    }

    .array-container .bracket {
      color: #6a8abb;
    }

    .array-container .value {
      color: #8fcbff;
    }

    .array-container .sep {
      color: #44556a;
    }

    .array-container .empty-state {
      color: #44556a;
      font-style: italic;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.9rem;
    }

    .array-container::-webkit-scrollbar {
      width: 4px;
    }

    .array-container::-webkit-scrollbar-track {
      background: transparent;
    }

    .array-container::-webkit-scrollbar-thumb {
      background: #3b5b8b;
      border-radius: 8px;
    }

    /* -------- CONTROLS -------- */
    .controls {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #b0c8f0;
      padding: 10px 22px;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      backdrop-filter: blur(4px);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      touch-action: manipulation;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.10);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background: linear-gradient(135deg, #3b7bdd, #7a5cdb);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 4px 16px rgba(59, 123, 221, 0.25);
    }

    .btn-primary:hover {
      box-shadow: 0 6px 24px rgba(59, 123, 221, 0.4);
      background: linear-gradient(135deg, #4a8bed, #8a6ceb);
    }

    .btn-danger {
      border-color: rgba(255, 70, 70, 0.2);
      color: #ff7a7a;
    }

    .btn-danger:hover {
      background: rgba(255, 70, 70, 0.08);
      border-color: rgba(255, 70, 70, 0.3);
    }

    .stats {
      display: flex;
      gap: 20px;
      margin-left: auto;
      color: #6a8abb;
      font-size: 0.75rem;
      align-items: center;
    }

    .stats span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .stats .num {
      color: #c8d8f0;
      font-weight: 600;
      min-width: 24px;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 4px;
      background: #3b5b8b;
      transition: background 0.2s;
    }

    .status-dot.active {
      background: #4ade80;
      box-shadow: 0 0 12px rgba(74, 222, 128, 0.3);
    }

    @media (max-width: 600px) {
      .card {
        padding: 18px 14px;
      }
      .tracker-row {
        flex-direction: column;
        align-items: stretch;
      }
      .track-wrapper {
        max-width: 100%;
        padding: 0 0 12px 0;
      }
      .track-container {
        height: 40px;
      }
      .thumb {
        width: 44px;
        height: 44px;
        font-size: 16px;
      }
      .array-container {
        min-height: 100px;
        max-height: 140px;
        font-size: 0.75rem;
      }
      .controls {
        flex-wrap: wrap;
      }
      .stats {
        margin-left: 0;
        width: 100%;
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>

<div class="card">
  <h1>
    <span>↔️ Tilt Stream</span>
    <small>swipe horizontally · record</small>
  </h1>
  <div class="sub">Drag the thumb left ↔ right to generate a stream of tilt values — displayed as an array in real time.</div>

  <div class="tracker-row">
    <!-- LEFT: Horizontal Thumb Tracker -->
    <div class="track-wrapper">
      <div class="track-container" id="trackContainer">
        <div class="track-fill" id="trackFill" style="width: 50%;"></div>
        <div class="thumb" id="thumb" style="left: 50%;">
          <span>↔</span>
        </div>
      </div>
      <div class="thumb-label" id="valueLabel">0°</div>
    </div>

    <!-- RIGHT: Array Display -->
    <div class="stream-panel">
      <div class="stream-header">
        <span>📋 tiltStream</span>
        <span class="badge" id="countBadge">0 values</span>
      </div>
      <div class="array-container" id="arrayContainer">
        <span class="empty-state">⏳ Drag the thumb to start recording</span>
      </div>

      <div class="controls">
        <button class="btn btn-primary" id="clearBtn">🗑️ Clear</button>
        <button class="btn" id="copyBtn">📋 Copy</button>
        <div class="stats">
          <span>📐 <span class="num" id="minVal">0</span>°</span>
          <span>📈 <span class="num" id="maxVal">0</span>°</span>
          <span><span class="status-dot" id="statusDot"></span> <span id="statusText">idle</span></span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  (function() {
    'use strict';

    // ----- DOM refs -----
    const trackContainer = document.getElementById('trackContainer');
    const thumb = document.getElementById('thumb');
    const trackFill = document.getElementById('trackFill');
    const valueLabel = document.getElementById('valueLabel');
    const arrayContainer = document.getElementById('arrayContainer');
    const countBadge = document.getElementById('countBadge');
    const minValEl = document.getElementById('minVal');
    const maxValEl = document.getElementById('maxVal');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const clearBtn = document.getElementById('clearBtn');
    const copyBtn = document.getElementById('copyBtn');

    // ----- State -----
    const tiltStream = [];
    let isDragging = false;
    let currentTilt = 0;          // -90 … +90
    let minTilt = 90;
    let maxTilt = -90;

    // ----- Helpers -----
    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function mapRange(value, inMin, inMax, outMin, outMax) {
      return outMin + ((value - inMin) / (inMax - inMin)) * (outMax - outMin);
    }

    // ----- Update UI with current stream -----
    function renderStream() {
      if (tiltStream.length === 0) {
        arrayContainer.innerHTML = `<span class="empty-state">⏳ Drag the thumb to start recording</span>`;
        countBadge.textContent = '0 values';
        minValEl.textContent = '0';
        maxValEl.textContent = '0';
        return;
      }

      const parts = tiltStream.map((v) => {
        const rounded = Math.round(v * 10) / 10;
        return `<span class="value">${rounded}</span>`;
      });
      const html = `<span class="bracket">[</span> ${parts.join('<span class="sep">, </span>')} <span class="bracket">]</span>`;
      arrayContainer.innerHTML = html;
      arrayContainer.scrollTop = arrayContainer.scrollHeight;

      countBadge.textContent = `${tiltStream.length} values`;
      minTilt = Math.min(...tiltStream);
      maxTilt = Math.max(...tiltStream);
      minValEl.textContent = Math.round(minTilt * 10) / 10;
      maxValEl.textContent = Math.round(maxTilt * 10) / 10;

      statusDot.classList.add('active');
      statusText.textContent = 'recording';
    }

    // ----- Record a new tilt value -----
    function recordTilt(value) {
      const clamped = clamp(Math.round(value * 10) / 10, -90, 90);
      tiltStream.push(clamped);
      renderStream();
    }

    // ----- Update thumb position and current tilt (horizontal) -----
    function updateThumb(clientX) {
      const rect = trackContainer.getBoundingClientRect();
      const trackWidth = rect.width;
      const relativeX = clamp((clientX - rect.left) / trackWidth, 0, 1);
      const percent = relativeX * 100;

      // Map 0–100% to -90 … +90 degrees
      const tilt = mapRange(percent, 0, 100, -90, 90);
      currentTilt = Math.round(tilt * 10) / 10;

      thumb.style.left = `${relativeX * 100}%`;
      trackFill.style.width = `${percent}%`;
      valueLabel.textContent = `${currentTilt}°`;

      if (isDragging) {
        recordTilt(currentTilt);
      }
    }

    // ----- Start dragging -----
    function startDrag(clientX) {
      isDragging = true;
      statusDot.classList.add('active');
      statusText.textContent = 'recording';
      thumb.style.cursor = 'grabbing';
      updateThumb(clientX);
    }

    // ----- Stop dragging -----
    function stopDrag() {
      if (isDragging) {
        isDragging = false;
        thumb.style.cursor = 'grab';
        if (tiltStream.length > 0) {
          statusText.textContent = 'paused';
        } else {
          statusDot.classList.remove('active');
          statusText.textContent = 'idle';
        }
      }
    }

    // ----- Clear stream -----
    function clearStream() {
      tiltStream.length = 0;
      minTilt = 90;
      maxTilt = -90;
      renderStream();
      statusDot.classList.remove('active');
      statusText.textContent = 'idle';
      // Reset thumb to center
      thumb.style.left = '50%';
      trackFill.style.width = '50%';
      currentTilt = 0;
      valueLabel.textContent = '0°';
    }

    // ----- Copy to clipboard -----
    function copyStream() {
      if (tiltStream.length === 0) {
        alert('Nothing to copy — stream is empty.');
        return;
      }
      const text = `[${tiltStream.map(v => Math.round(v * 10) / 10).join(', ')}]`;
      navigator.clipboard?.writeText(text).then(() => {
        const orig = copyBtn.textContent;
        copyBtn.textContent = '✅ Copied!';
        setTimeout(() => { copyBtn.textContent = orig; }, 2000);
      }).catch(() => {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        const orig = copyBtn.textContent;
        copyBtn.textContent = '✅ Copied!';
        setTimeout(() => { copyBtn.textContent = orig; }, 2000);
      });
    }

    // ----- Event listeners (mouse) -----
    function onMouseDown(e) {
      e.preventDefault();
      startDrag(e.clientX);
      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', onMouseUp);
    }

    function onMouseMove(e) {
      if (!isDragging) return;
      e.preventDefault();
      updateThumb(e.clientX);
    }

    function onMouseUp(e) {
      stopDrag();
      window.removeEventListener('mousemove', onMouseMove);
      window.removeEventListener('mouseup', onMouseUp);
    }

    // ----- Event listeners (touch) -----
    function onTouchStart(e) {
      e.preventDefault();
      const touch = e.touches[0];
      if (touch) {
        startDrag(touch.clientX);
        window.addEventListener('touchmove', onTouchMove, { passive: false });
        window.addEventListener('touchend', onTouchEnd, { passive: false });
        window.addEventListener('touchcancel', onTouchEnd, { passive: false });
      }
    }

    function onTouchMove(e) {
      if (!isDragging) return;
      e.preventDefault();
      const touch = e.touches[0];
      if (touch) {
        updateThumb(touch.clientX);
      }
    }

    function onTouchEnd(e) {
      stopDrag();
      window.removeEventListener('touchmove', onTouchMove);
      window.removeEventListener('touchend', onTouchEnd);
      window.removeEventListener('touchcancel', onTouchEnd);
    }

    // ----- Init -----
    function init() {
      thumb.addEventListener('mousedown', onMouseDown);
      trackContainer.addEventListener('mousedown', (e) => {
        if (!isDragging) {
          startDrag(e.clientX);
        }
      });

      thumb.addEventListener('touchstart', onTouchStart, { passive: false });
      trackContainer.addEventListener('touchstart', (e) => {
        if (!isDragging) {
          const touch = e.touches[0];
          if (touch) {
            startDrag(touch.clientX);
          }
        }
      }, { passive: false });

      clearBtn.addEventListener('click', clearStream);
      copyBtn.addEventListener('click', copyStream);

      clearStream();
      statusDot.classList.remove('active');
      statusText.textContent = 'idle';

      console.log('✅ Horizontal Tilt Stream ready — drag the thumb left/right to record.');
    }

    init();
  })();
</script>
</body>
</html>
