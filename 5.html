<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tilt · Swipe</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      min-height: 100vh;
      background: #0b1120;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 16px;
    }
    .card {
      background: rgba(18, 26, 40, 0.7);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 42px;
      padding: 28px 24px;
      max-width: 720px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
    }
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      margin: 12px 0 16px 0;
    }
    .panel {
      flex: 1 1 180px;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 24px;
      padding: 18px 16px 16px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(4px);
    }
    .panel-label {
      display: flex;
      justify-content: space-between;
      color: #7a8aaa;
      font-size: 0.7rem;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .tilt-row {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .tilt-item .tag {
      font-size: 0.6rem;
      color: #5a6a8a;
    }
    .tilt-item .num {
      font-size: 1.6rem;
      font-weight: 480;
      color: #b8d0fc;
      font-family: 'JetBrains Mono', 'SF Mono', monospace;
      line-height: 1.2;
    }
    .stream-box {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 14px;
      padding: 10px 12px;
      max-height: 110px;
      overflow-y: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      line-height: 1.7;
      color: #8fcbff;
      border: 1px solid rgba(255, 255, 255, 0.02);
      scrollbar-width: thin;
      scrollbar-color: #3b5b8b transparent;
    }
    .stream-box::-webkit-scrollbar { width: 4px; }
    .stream-box::-webkit-scrollbar-thumb { background: #3b5b8b; border-radius: 12px; }
    .empty-placeholder { color: #44556a; font-style: italic; font-family: 'Segoe UI', sans-serif; }

    /* swipe */
    .track-wrap {
      position: relative;
      width: 100%;
      height: 48px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 60px;
      box-shadow: inset 0 4px 16px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      touch-action: none;
      cursor: pointer;
      margin: 6px 0 10px 0;
    }
    .track-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 50%;
      background: linear-gradient(90deg, #2f6edb, #7a5cdb);
      border-radius: 60px;
      pointer-events: none;
      transition: width 0.04s ease;
    }
    .thumb {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
      background: radial-gradient(circle at 30% 30%, #f0f5ff, #b8cef5);
      border-radius: 50%;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
      touch-action: none;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #1a2332;
      left: 50%;
      user-select: none;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .thumb:active { cursor: grabbing; }
    .swipe-value {
      text-align: center;
      color: #99aacd;
      font-size: 0.8rem;
      font-weight: 420;
      margin-bottom: 2px;
    }

    .badge {
      color: #6a8abb;
      font-size: 0.65rem;
      background: rgba(255,255,255,0.04);
      padding: 2px 10px;
      border-radius: 30px;
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3b5b8b;
      margin-right: 5px;
      transition: background 0.2s;
    }
    .status-dot.active { background: #4ade80; box-shadow: 0 0 12px rgba(74, 222, 128, 0.3); }
    .status-text { font-size: 0.6rem; color: #5a6a8a; }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }
    .btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: #b0c8f0;
      padding: 8px 18px;
      border-radius: 40px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: 0.15s;
      font-weight: 400;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.1); }
    .btn-primary {
      background: linear-gradient(135deg, #3b7bdd, #7a5cdb);
      border-color: transparent;
      color: #fff;
    }
    .btn-primary:hover { opacity: 0.9; background: linear-gradient(135deg, #4a8bed, #8a6ceb); }
    .btn-danger { border-color: rgba(255, 80, 80, 0.15); color: #ff7a7a; }
    .btn-danger:hover { background: rgba(255, 80, 80, 0.06); }
    .flex-right { margin-left: auto; align-self: center; color: #4a6a8a; font-size: 0.7rem; }

    @media (max-width: 540px) {
      .card { padding: 20px 16px; }
      .panel { flex: 1 1 100%; }
      .tilt-item .num { font-size: 1.3rem; }
    }
  </style>
</head>
<body>
<div class="card">
  <!-- header -->
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
    <span style="color:#d0e0ff; font-weight:300; font-size:1.3rem;">↕️ Tilt · Swipe</span>
    <span style="color:#6a8abb; font-size:0.65rem;">real · stream</span>
  </div>

  <div class="grid">
    <!-- Tilt panel -->
    <div class="panel">
      <div class="panel-label">
        <span>📐 device tilt</span>
        <span class="badge" id="tiltCount">0</span>
      </div>
      <div class="tilt-row">
        <div class="tilt-item"><span class="tag">β (pitch)</span><div class="num" id="betaDisplay">0°</div></div>
        <div class="tilt-item"><span class="tag">γ (roll)</span><div class="num" id="gammaDisplay">0°</div></div>
      </div>
      <div class="stream-box" id="tiltBox"><span class="empty-placeholder">⏳ waiting for tilt</span></div>
      <div style="margin-top:6px;"><span class="status-dot active" id="tiltDot"></span><span class="status-text" id="tiltStatus">recording</span></div>
    </div>

    <!-- Swipe panel -->
    <div class="panel">
      <div class="panel-label">
        <span>↔️ swipe stream</span>
        <span class="badge" id="swipeCount">0</span>
      </div>
      <div class="swipe-value" id="swipeDisplay">0°</div>
      <div class="track-wrap" id="trackWrap">
        <div class="track-fill" id="trackFill" style="width:50%;"></div>
        <div class="thumb" id="thumb" style="left:50%;">↔</div>
      </div>
      <div class="stream-box" id="swipeBox"><span class="empty-placeholder">⏳ drag thumb</span></div>
      <div style="margin-top:6px;"><span class="status-dot" id="swipeDot"></span><span class="status-text" id="swipeStatus">idle</span></div>
    </div>
  </div>

  <!-- actions -->
  <div class="actions">
    <button class="btn btn-danger" id="clearBtn">🗑️ Clear all</button>
    <button class="btn" id="copyTiltBtn">📋 Copy tilt</button>
    <button class="btn" id="copySwipeBtn">📋 Copy swipe</button>
    <span class="flex-right" id="permBadge">✅ auto</span>
  </div>
</div>

<script>
  (function(){
    'use strict';

    // DOM
    const betaEl = document.getElementById('betaDisplay');
    const gammaEl = document.getElementById('gammaDisplay');
    const tiltBox = document.getElementById('tiltBox');
    const tiltCount = document.getElementById('tiltCount');
    const tiltDot = document.getElementById('tiltDot');
    const tiltStatus = document.getElementById('tiltStatus');

    const trackWrap = document.getElementById('trackWrap');
    const thumb = document.getElementById('thumb');
    const trackFill = document.getElementById('trackFill');
    const swipeDisplay = document.getElementById('swipeDisplay');
    const swipeBox = document.getElementById('swipeBox');
    const swipeCount = document.getElementById('swipeCount');
    const swipeDot = document.getElementById('swipeDot');
    const swipeStatus = document.getElementById('swipeStatus');

    const clearBtn = document.getElementById('clearBtn');
    const copyTiltBtn = document.getElementById('copyTiltBtn');
    const copySwipeBtn = document.getElementById('copySwipeBtn');
    const permBadge = document.getElementById('permBadge');

    // state
    const tiltStream = [];
    const swipeStream = [];
    let isDragging = false;
    let currentSwipe = 0;
    let tiltActive = false;

    // helpers
    const clamp = (v,min,max) => Math.min(Math.max(v,min),max);
    const mapRange = (v, inMin, inMax, outMin, outMax) => outMin + ((v - inMin) / (inMax - inMin)) * (outMax - outMin);
    const r1 = v => Math.round(v * 10) / 10;

    // render tilt
    function renderTilt() {
      if (!tiltStream.length) {
        tiltBox.innerHTML = `<span class="empty-placeholder">⏳ waiting for tilt</span>`;
        tiltCount.textContent = '0';
        return;
      }
      const parts = tiltStream.map(e => `<span style="color:#8fcbff;">${r1(e.beta)}°</span><span style="color:#44556a;">/</span><span style="color:#7aadff;">${r1(e.gamma)}°</span>`);
      tiltBox.innerHTML = `<span style="color:#6a8abb;">[</span> ${parts.join('<span style="color:#44556a;">, </span>')} <span style="color:#6a8abb;">]</span>`;
      tiltBox.scrollTop = tiltBox.scrollHeight;
      tiltCount.textContent = tiltStream.length;
    }

    // render swipe
    function renderSwipe() {
      if (!swipeStream.length) {
        swipeBox.innerHTML = `<span class="empty-placeholder">⏳ drag thumb</span>`;
        swipeCount.textContent = '0';
        return;
      }
      const parts = swipeStream.map(v => `<span style="color:#a8c8ff;">${r1(v)}°</span>`);
      swipeBox.innerHTML = `<span style="color:#6a8abb;">[</span> ${parts.join('<span style="color:#44556a;">, </span>')} <span style="color:#6a8abb;">]</span>`;
      swipeBox.scrollTop = swipeBox.scrollHeight;
      swipeCount.textContent = swipeStream.length;
    }

    // record tilt
    function pushTilt(beta, gamma) {
      tiltStream.push({ beta: r1(beta), gamma: r1(gamma) });
      renderTilt();
      tiltDot.classList.add('active');
      tiltStatus.textContent = 'recording';
      tiltActive = true;
    }

    // record swipe
    function pushSwipe(val) {
      const v = clamp(Math.round(val * 10) / 10, -90, 90);
      swipeStream.push(v);
      renderSwipe();
      swipeDot.classList.add('active');
      swipeStatus.textContent = 'recording';
    }

    // update thumb
    function updateThumb(clientX) {
      const rect = trackWrap.getBoundingClientRect();
      let relX = clamp((clientX - rect.left) / rect.width, 0, 1);
      if (isNaN(relX)) relX = 0.5;
      const deg = mapRange(relX, 0, 1, -90, 90);
      currentSwipe = Math.round(deg * 10) / 10;
      thumb.style.left = `${relX * 100}%`;
      trackFill.style.width = `${relX * 100}%`;
      swipeDisplay.textContent = `${currentSwipe}°`;
      if (isDragging) pushSwipe(currentSwipe);
    }

    // drag control
    function startDrag(clientX) {
      isDragging = true;
      thumb.style.cursor = 'grabbing';
      swipeDot.classList.add('active');
      swipeStatus.textContent = 'recording';
      updateThumb(clientX);
    }
    function stopDrag() {
      if (isDragging) {
        isDragging = false;
        thumb.style.cursor = 'grab';
        if (swipeStream.length) swipeStatus.textContent = 'paused';
        else { swipeDot.classList.remove('active'); swipeStatus.textContent = 'idle'; }
      }
    }

    // mouse
    function onMouseDown(e) { e.preventDefault(); startDrag(e.clientX); }
    function onMouseMove(e) { if (!isDragging) return; e.preventDefault(); updateThumb(e.clientX); }
    function onMouseUp(e) { stopDrag(); }

    // touch
    function onTouchStart(e) { e.preventDefault(); const t = e.touches[0]; if (t) startDrag(t.clientX); }
    function onTouchMove(e) { if (!isDragging) return; e.preventDefault(); const t = e.touches[0]; if (t) updateThumb(t.clientX); }
    function onTouchEnd(e) { stopDrag(); }

    // clear
    function clearAll() {
      tiltStream.length = 0;
      swipeStream.length = 0;
      renderTilt(); renderSwipe();
      thumb.style.left = '50%'; trackFill.style.width = '50%';
      currentSwipe = 0; swipeDisplay.textContent = '0°';
      tiltDot.classList.remove('active'); tiltStatus.textContent = 'idle';
      swipeDot.classList.remove('active'); swipeStatus.textContent = 'idle';
      tiltActive = false;
    }

    // copy
    function copyTilt() {
      if (!tiltStream.length) return alert('No tilt data');
      const txt = tiltStream.map(e => `(${r1(e.beta)}°, ${r1(e.gamma)}°)`).join(', ');
      navigator.clipboard?.writeText(`[${txt}]`).then(()=>alert('Copied tilt!')).catch(()=>alert('Copy failed'));
    }
    function copySwipe() {
      if (!swipeStream.length) return alert('No swipe data');
      const txt = swipeStream.map(v => `${r1(v)}°`).join(', ');
      navigator.clipboard?.writeText(`[${txt}]`).then(()=>alert('Copied swipe!')).catch(()=>alert('Copy failed'));
    }

    // device orientation
    function handleOrientation(e) {
      const beta = e.beta || 0;
      const gamma = e.gamma || 0;
      betaEl.textContent = `${r1(beta)}°`;
      gammaEl.textContent = `${r1(gamma)}°`;
      if (!tiltStream.length || tiltActive) {
        pushTilt(beta, gamma);
      }
    }

    // permission
    function requestPermission() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(state => {
            if (state === 'granted') {
              permBadge.textContent = '✅ granted';
              window.addEventListener('deviceorientation', handleOrientation);
            } else {
              permBadge.textContent = '❌ denied';
            }
          })
          .catch(() => { permBadge.textContent = '⚠️ error'; });
      } else {
        permBadge.textContent = '✅ auto';
        window.addEventListener('deviceorientation', handleOrientation);
      }
    }

    // init
    function init() {
      permBadge.textContent = '⏳ req…';
      requestPermission();

      // swipe events
      thumb.addEventListener('mousedown', onMouseDown);
      trackWrap.addEventListener('mousedown', (e) => { if (!isDragging) startDrag(e.clientX); });
      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', onMouseUp);

      thumb.addEventListener('touchstart', onTouchStart, { passive: false });
      trackWrap.addEventListener('touchstart', (e) => {
        if (!isDragging) {
          const t = e.touches[0];
          if (t) startDrag(t.clientX);
        }
      }, { passive: false });
      window.addEventListener('touchmove', onTouchMove, { passive: false });
      window.addEventListener('touchend', onTouchEnd, { passive: false });
      window.addEventListener('touchcancel', onTouchEnd, { passive: false });

      clearBtn.addEventListener('click', clearAll);
      copyTiltBtn.addEventListener('click', copyTilt);
      copySwipeBtn.addEventListener('click', copySwipe);

      renderTilt(); renderSwipe();
      thumb.style.left = '50%'; trackFill.style.width = '50%';
      swipeDisplay.textContent = '0°';
    }

    init();
  })();
</script>
</body>
</html>
