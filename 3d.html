<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bot Detection CAPTCHA - Robot Orientation PoC</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .captcha-card {
      background: #1e293b;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      width: 320px;
      text-align: center;
      user-select: none;
      border: 1px solid #334155;
    }

    h3 {
      margin-top: 0;
      color: #f8fafc;
      font-size: 1.15rem;
    }

    p {
      color: #94a3b8;
      font-size: 0.85rem;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    #viewport {
      width: 100%;
      height: 260px;
      background: #090d16;
      border: 2px dashed #475569;
      border-radius: 10px;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
    }

    #viewport:active {
      cursor: grabbing;
      border-color: #38bdf8;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-submit {
      background: #0284c7;
      color: white;
    }

    .btn-submit:hover {
      background: #0369a1;
    }

    .btn-reset {
      background: #334155;
      color: #cbd5e1;
    }

    .btn-reset:hover {
      background: #475569;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
      font-size: 0.9rem;
      min-height: 1.2em;
    }
    .success { color: #4ade80; }
    .error { color: #f87171; }
  </style>

  <!-- Import Three.js via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div class="captcha-card">
  <h3>Human Verification</h3>
  <p>Drag the 3D robot so that it is standing upright and <strong>pointing its arm directly at you</strong>.</p>
  
  <div id="viewport"></div>

  <div class="actions">
    <button class="btn-reset" onclick="resetCaptcha()">Reset</button>
    <button class="btn-submit" onclick="verifyOrientation()">Verify</button>
  </div>

  <div id="status"></div>
</div>

<script>
  let scene, camera, renderer, robotGroup;
  let isDragging = false;
  let previousPointerPosition = { x: 0, y: 0 };
  
  // Acceptable error margin (~14 degrees tolerance)
  const TOLERANCE_RADIANS = 0.25;

  // 1. Initialize Scene & Environment
  function initScene() {
    const container = document.getElementById('viewport');
    
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x090d16);

    camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 0, 7.5);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    // Dynamic Cyber Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const backLight = new THREE.DirectionalLight(0x818cf8, 0.8);
    backLight.position.set(-5, -5, -5);
    scene.add(backLight);

    // Construct 3D Robot Mesh
    createRobotCharacter();

    // Attach Drag Event Handlers
    container.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);

    // Generate First Challenge
    resetCaptcha();

    // Animation Loop
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  }

  // 2. Build Procedural 3D Robot Character
  function createRobotCharacter() {
    robotGroup = new THREE.Group();

    const metalMaterial = new THREE.MeshPhongMaterial({ color: 0x475569, shininess: 80 });
    const darkMetalMaterial = new THREE.MeshPhongMaterial({ color: 0x1e293b });
    const visorMaterial = new THREE.MeshBasicMaterial({ color: 0x38bdf8 }); // Glowing Cyan
    const pointerMaterial = new THREE.MeshBasicMaterial({ color: 0xef4444 }); // Red Pointer Tip

    // Robot Head
    const headGeo = new THREE.BoxGeometry(0.9, 0.7, 0.7);
    const head = new THREE.Mesh(headGeo, metalMaterial);
    head.position.y = 1.0;
    robotGroup.add(head);

    // Robot Visor / Eyes
    const visorGeo = new THREE.BoxGeometry(0.7, 0.2, 0.1);
    const visor = new THREE.Mesh(visorGeo, visorMaterial);
    visor.position.set(0, 1.05, 0.36); // Positioned on front of head (+Z)
    robotGroup.add(visor);

    // Robot Torso
    const torsoGeo = new THREE.CylinderGeometry(0.5, 0.4, 1.2, 16);
    const torso = new THREE.Mesh(torsoGeo, darkMetalMaterial);
    torso.position.y = 0;
    robotGroup.add(torso);

    // Chest Core Light (Indicates front)
    const coreGeo = new THREE.CircleGeometry(0.15, 16);
    const core = new THREE.Mesh(coreGeo, visorMaterial);
    core.position.set(0, 0.2, 0.41);
    robotGroup.add(core);

    // Left Arm (Neutral by side)
    const armGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.9);
    const leftArm = new THREE.Mesh(armGeo, metalMaterial);
    leftArm.position.set(-0.65, 0, 0);
    robotGroup.add(leftArm);

    // Right Arm (Extends Straight Out Forward (+Z Direction))
    const pointingArmGroup = new THREE.Group();
    
    const armMesh = new THREE.Mesh(armGeo, metalMaterial);
    armMesh.rotation.x = Math.PI / 2; // Point forward
    armMesh.position.z = 0.45;
    pointingArmGroup.add(armMesh);

    // Red Laser / Pointer Tip on the end of arm
    const pointerGeo = new THREE.ConeGeometry(0.08, 0.2, 16);
    const pointerTip = new THREE.Mesh(pointerGeo, pointerMaterial);
    pointerTip.rotation.x = Math.PI / 2;
    pointerTip.position.z = 0.95;
    pointingArmGroup.add(pointerTip);

    pointingArmGroup.position.set(0.65, 0.2, 0);
    robotGroup.add(pointingArmGroup);

    scene.add(robotGroup);
  }

  // 3. Pointer Drag Rotation Handlers
  function onPointerDown(e) {
    isDragging = true;
    previousPointerPosition = { x: e.clientX, y: e.clientY };
  }

  function onPointerMove(e) {
    if (!isDragging) return;

    const deltaX = e.clientX - previousPointerPosition.x;
    const deltaY = e.clientY - previousPointerPosition.y;

    const deltaRotationQuaternion = new THREE.Quaternion()
      .setFromEuler(new THREE.Euler(
        toRadians(deltaY * 0.5),
        toRadians(deltaX * 0.5),
        0,
        'XYZ'
      ));

    robotGroup.quaternion.multiplyQuaternions(deltaRotationQuaternion, robotGroup.quaternion);
    previousPointerPosition = { x: e.clientX, y: e.clientY };
  }

  function onPointerUp() {
    isDragging = false;
  }

  function toRadians(angle) {
    return (angle * Math.PI) / 180;
  }

  // 4. Randomize 3D Orientation
  function resetCaptcha() {
    const status = document.getElementById('status');
    status.innerText = "";
    status.className = "";

    // Generate random 3D rotation angles for pitch, yaw, and roll
    const randomEuler = new THREE.Euler(
      (Math.random() * 2 + 1) * (Math.random() > 0.5 ? 1 : -1),
      (Math.random() * 2 + 1) * (Math.random() > 0.5 ? 1 : -1),
      (Math.random() * 2 + 1) * (Math.random() > 0.5 ? 1 : -1)
    );

    robotGroup.quaternion.setFromEuler(randomEuler);
  }

  // 5. Verification Logic (Checks if Arm & Visor Face Camera)
  function verifyOrientation() {
    // Standard forward direction pointing at camera is +Z vector (0, 0, 1)
    const cameraVector = new THREE.Vector3(0, 0, 1);
    
    // Get the robot's local forward vector transformed into world space
    const robotForwardVector = new THREE.Vector3(0, 0, 1).applyQuaternion(robotGroup.quaternion);

    // Calculate angular distance between current robot facing vector and camera direction
    const angleDiff = robotForwardVector.angleTo(cameraVector);

    const status = document.getElementById('status');

    if (angleDiff <= TOLERANCE_RADIANS) {
      status.innerText = "✓ Verified! Robot is pointing at you.";
      status.className = "success";
    } else {
      status.innerText = "✗ Failed. Robot is not aligned correctly.";
      status.className = "error";
    }
  }

  window.onload = initScene;
</script>
</body>
</html>
