<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pascalían Security Verification</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #334155;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .captcha-card {
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      width: 330px;
      text-align: center;
      user-select: none;
      border: 1px solid #e2e8f0;
    }

    .brand-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: #475569;
      margin: 0 0 8px 0;
      letter-spacing: -0.5px;
    }

    .brand-title span {
      color: #f97316;
    }

    p {
      color: #64748b;
      font-size: 0.85rem;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    #viewport {
      width: 100%;
      height: 260px;
      background: #f1f5f9;
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
    }

    #viewport:active {
      cursor: grabbing;
      border-color: #f97316;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-submit {
      background: #f97316;
      color: white;
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
    }

    .btn-submit:hover {
      background: #ea580c;
    }

    .btn-reset {
      background: #e2e8f0;
      color: #475569;
    }

    .btn-reset:hover {
      background: #cbd5e1;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
      font-size: 0.9rem;
      min-height: 1.2em;
    }
    .success { color: #16a34a; }
    .error { color: #dc2626; }
  </style>

  <!-- Import Three.js via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div class="captcha-card">
  <h3 class="brand-title">Pascal<span>í</span>an</h3>
  <p>Drag the 3D orange accent mark until it points <strong>upward toward the top-right</strong> facing you.</p>
  
  <div id="viewport"></div>

  <div class="actions">
    <button class="btn-reset" onclick="resetCaptcha()">Reset</button>
    <button class="btn-submit" onclick="verifyOrientation()">Verify</button>
  </div>

  <div id="status"></div>
</div>

<script>
  let scene, camera, renderer, accentGroup;
  let isDragging = false;
  let previousPointerPosition = { x: 0, y: 0 };
  
  // Margin of error allowance (~14 degrees)
  const TOLERANCE_RADIANS = 0.25;

  // 1. Initialize Scene & Environment
  function initScene() {
    const container = document.getElementById('viewport');
    
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf1f5f9);

    camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 0, 7);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    // Warm Lighting Setup
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(5, 8, 5);
    scene.add(dirLight);

    // Build 3D Pascalian Accent Mark
    createPascalianAccent();

    // Attach Drag Event Handlers
    container.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);

    // Generate Initial Challenge
    resetCaptcha();

    // Render Loop
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  }

  // 2. Build Procedural 3D Orange Leaf/Accent Mark
  function createPascalianAccent() {
    accentGroup = new THREE.Group();

    // Vibrant Orange Material matching Pascalian logo accent
    const orangeMaterial = new THREE.MeshPhongMaterial({ 
      color: 0xf97316, 
      shininess: 60,
      specular: 0xffedd5
    });

    // Create 2D Curved Accent Blade Shape
    const accentShape = new THREE.Shape();
    accentShape.moveTo(0, -1.2);
    accentShape.quadraticCurveTo(0.6, -0.2, 0.8, 0.8);
    accentShape.quadraticCurveTo(0.2, 0.5, 0, -1.2);

    const extrudeSettings = { depth: 0.2, bevelEnabled: true, bevelSegments: 3, steps: 1, bevelSize: 0.05, bevelThickness: 0.05 };
    const accentGeo = new THREE.ExtrudeGeometry(accentShape, extrudeSettings);
    accentGeo.center();
    
    const accentMesh = new THREE.Mesh(accentGeo, orangeMaterial);
    
    // Tilt to match the logo's signature diagonal accent inclination
    accentMesh.rotation.z = -Math.PI / 6;

    accentGroup.add(accentMesh);
    scene.add(accentGroup);
  }

  // 3. Pointer Drag Rotation Handlers
  function onPointerDown(e) {
    isDragging = true;
    previousPointerPosition = { x: e.clientX, y: e.clientY };
  }

  function onPointerMove(e) {
    if (!isDragging) return;

    const deltaX = e.clientX - previousPointerPosition.x;
    const deltaY = e.clientY - previousPointerPosition.y;

    const deltaRotationQuaternion = new THREE.Quaternion()
      .setFromEuler(new THREE.Euler(
        toRadians(deltaY * 0.5),
        toRadians(deltaX * 0.5),
        0,
        'XYZ'
      ));

    accentGroup.quaternion.multiplyQuaternions(deltaRotationQuaternion, accentGroup.quaternion);
    previousPointerPosition = { x: e.clientX, y: e.clientY };
  }

  function onPointerUp() {
    isDragging = false;
  }

  function toRadians(angle) {
    return (angle * Math.PI) / 180;
  }

  // 4. Randomize 3D Orientation on Reset
  function resetCaptcha() {
    const status = document.getElementById('status');
    status.innerText = "";
    status.className = "";

    // Generate random rotations along X, Y, Z axes
    const randomEuler = new THREE.Euler(
      (Math.random() * 2 + 1) * (Math.random() > 0.5 ? 1 : -1),
      (Math.random() * 2 + 1) * (Math.random() > 0.5 ? 1 : -1),
      (Math.random() * 2 + 1) * (Math.random() > 0.5 ? 1 : -1)
    );

    accentGroup.quaternion.setFromEuler(randomEuler);
  }

  // 5. Verification Logic
  function verifyOrientation() {
    const cameraVector = new THREE.Vector3(0, 0, 1);
    const accentForwardVector = new THREE.Vector3(0, 0, 1).applyQuaternion(accentGroup.quaternion);

    const angleDiff = accentForwardVector.angleTo(cameraVector);

    const status = document.getElementById('status');

    if (angleDiff <= TOLERANCE_RADIANS) {
      status.innerText = "✓ Verification Successful!";
      status.className = "success";
    } else {
      status.innerText = "✗ Misaligned. Align the mark correctly.";
      status.className = "error";
    }
  }

  window.onload = initScene;
</script>
</body>
</html>
