<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mFilterIt Security Verification</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d0914;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .captcha-card {
      background: #171123;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(112, 10, 168, 0.2);
      width: 320px;
      text-align: center;
      user-select: none;
      border: 1px solid #2f1d47;
    }

    .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .brand-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #ffffff;
      margin: 0;
      letter-spacing: -0.5px;
    }

    .brand-title span {
      color: #8b5cf6;
    }

    p {
      color: #a78bfa;
      font-size: 0.85rem;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    #viewport {
      width: 100%;
      height: 260px;
      background: #090510;
      border: 2px dashed #4c1d95;
      border-radius: 12px;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
    }

    #viewport:active {
      cursor: grabbing;
      border-color: #a855f7;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-submit {
      background: linear-gradient(135deg, #7e22ce, #6b21a8);
      color: white;
      box-shadow: 0 4px 12px rgba(126, 34, 206, 0.4);
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #9333ea, #7e22ce);
    }

    .btn-reset {
      background: #2e1065;
      color: #ddd6fe;
    }

    .btn-reset:hover {
      background: #3b0764;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
      font-size: 0.9rem;
      min-height: 1.2em;
    }
    .success { color: #4ade80; }
    .error { color: #f87171; }
  </style>

  <!-- Import Three.js via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div class="captcha-card">
  <div class="logo-container">
    <h3 class="brand-title">m<span>Filter</span>It</h3>
  </div>
  <p>Drag the 3D logo so that the <strong>filter icon is upright and facing you</strong>.</p>
  
  <div id="viewport"></div>

  <div class="actions">
    <button class="btn-reset" onclick="resetCaptcha()">Reset</button>
    <button class="btn-submit" onclick="verifyOrientation()">Verify</button>
  </div>

  <div id="status"></div>
</div>

<script>
  let scene, camera, renderer, logoGroup;
  let isDragging = false;
  let previousPointerPosition = { x: 0, y: 0 };
  
  // Acceptable error margin (~14 degrees tolerance)
  const TOLERANCE_RADIANS = 0.25;

  // 1. Initialize Scene & Environment
  function initScene() {
    const container = document.getElementById('viewport');
    
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x090510);

    camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 0, 7.5);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    // Purple/Cyber Lights matching mFilterIt theme
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xa855f7, 1.5);
    dirLight.position.set(5, 8, 5);
    scene.add(dirLight);

    const backLight = new THREE.DirectionalLight(0x3b82f6, 0.8);
    backLight.position.set(-5, -5, -5);
    scene.add(backLight);

    // Construct 3D mFilterIt Emblem
    createmFilterItLogo();

    // Attach Drag Event Handlers
    container.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);

    // Generate First Challenge
    resetCaptcha();

    // Animation Loop
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  }

  // 2. Build Procedural 3D mFilterIt Logo Emblem
  function createmFilterItLogo() {
    logoGroup = new THREE.Group();

    // Metallic Purple Material for Hexagon Shield
    const purpleMaterial = new THREE.MeshPhongMaterial({ 
      color: 0x6b21a8, 
      shininess: 90,
      specular: 0xc084fc
    });
    
    const whiteMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });

    // Build Rounded Hexagon Geometry Base
    const hexShape = new THREE.Shape();
    const radius = 1.3;
    for (let i = 0; i < 6; i++) {
      const angle = (i * Math.PI) / 3 + Math.PI / 6;
      const x = radius * Math.cos(angle);
      const y = radius * Math.sin(angle);
      if (i === 0) hexShape.moveTo(x, y);
      else hexShape.lineTo(x, y);
    }
    hexShape.closePath();

    const extrudeSettings = { depth: 0.3, bevelEnabled: true, bevelSegments: 3, steps: 1, bevelSize: 0.08, bevelThickness: 0.08 };
    const hexGeo = new THREE.ExtrudeGeometry(hexShape, extrudeSettings);
    hexGeo.center();
    
    const hexagon = new THREE.Mesh(hexGeo, purpleMaterial);
    logoGroup.add(hexagon);

    // Build Inner Funnel Icon (Front Facing)
    const funnelGroup = new THREE.Group();

    // Funnel Top Trap
    const topGeo = new THREE.CylinderGeometry(0.55, 0.25, 0.45, 32);
    const topMesh = new THREE.Mesh(topGeo, whiteMaterial);
    topMesh.position.y = 0.22;
    funnelGroup.add(topMesh);

    // Funnel Bottom Stem
    const stemGeo = new THREE.BoxGeometry(0.18, 0.45, 0.1);
    const stemMesh = new THREE.Mesh(stemGeo, whiteMaterial);
    stemMesh.position.y = -0.18;
    funnelGroup.add(stemMesh);

    // Position Funnel slightly off front face (+Z)
    funnelGroup.position.z = 0.24;
    logoGroup.add(funnelGroup);

    scene.add(logoGroup);
  }

  // 3. Pointer Drag Rotation Handlers
  function onPointerDown(e) {
    isDragging = true;
    previousPointerPosition = { x: e.clientX, y: e.clientY };
  }

  function onPointerMove(e) {
    if (!isDragging) return;

    const deltaX = e.clientX - previousPointerPosition.x;
    const deltaY = e.clientY - previousPointerPosition.y;

    const deltaRotationQuaternion = new THREE.Quaternion()
      .setFromEuler(new THREE.Euler(
        toRadians(deltaY * 0.5),
        toRadians(deltaX * 0.5),
        0,
        'XYZ'
      ));

    logoGroup.quaternion.multiplyQuaternions(deltaRotationQuaternion, logoGroup.quaternion);
    previousPointerPosition = { x: e.clientX, y: e.clientY };
  }

  function onPointerUp() {
    isDragging = false;
  }

  function toRadians(angle) {
    return (angle * Math.PI) / 180;
  }

  // 4. Randomize 3D Orientation
  function resetCaptcha() {
    const status = document.getElementById('status');
    status.innerText = "";
    status.className = "";

    // Randomize Pitch, Yaw, and Roll
    const randomEuler = new THREE.Euler(
      (Math.random() * 2 + 1) * (Math.random() > 0.5 ? 1 : -1),
      (Math.random() * 2 + 1) * (Math.random() > 0.5 ? 1 : -1),
      (Math.random() * 2 + 1) * (Math.random() > 0.5 ? 1 : -1)
    );

    logoGroup.quaternion.setFromEuler(randomEuler);
  }

  // 5. Verification Logic (Checks if Shield & Funnel face the user upright)
  function verifyOrientation() {
    // Standard forward vector facing camera is +Z (0, 0, 1)
    const cameraVector = new THREE.Vector3(0, 0, 1);
    const logoForwardVector = new THREE.Vector3(0, 0, 1).applyQuaternion(logoGroup.quaternion);

    // Calculate angular offset
    const angleDiff = logoForwardVector.angleTo(cameraVector);

    const status = document.getElementById('status');

    if (angleDiff <= TOLERANCE_RADIANS) {
      status.innerText = "✓ Verification Successful!";
      status.className = "success";
    } else {
      status.innerText = "✗ Misaligned. Rotate the filter upright.";
      status.className = "error";
    }
  }

  window.onload = initScene;
</script>
</body>
</html>
